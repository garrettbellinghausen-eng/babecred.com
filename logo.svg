<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="95" fill="none" stroke="#3B1F0B" stroke-width="4"/>
  <circle cx="100" cy="100" r="88" fill="none" stroke="#E8A317" stroke-width="2"/>
  <circle cx="100" cy="100" r="82" fill="none" stroke="#3B1F0B" stroke-width="1"/>

  <!-- Background fill -->
  <circle cx="100" cy="100" r="81" fill="#1A1108"/>

  <!-- Top curved text: BABE CRED -->
  <defs>
    <path id="top-arc" d="M 30,100 a 70,70 0 1,1 140,0" fill="none"/>
    <path id="bot-arc" d="M 170,100 a 70,70 0 1,1 -140,0" fill="none"/>
  </defs>
  <text font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="14" fill="#E8A317" letter-spacing="6">
    <textPath href="#top-arc" startOffset="50%" text-anchor="middle">BABE CRED</textPath>
  </text>

  <!-- Bottom curved text: EST. 2025 -->
  <text font-family="Arial, sans-serif" font-weight="700" font-size="11" fill="#6B6B3C" letter-spacing="4">
    <textPath href="#bot-arc" startOffset="50%" text-anchor="middle">EST. 2025</textPath>
  </text>

  <!-- Center: Balance scale with heart -->
  <!-- Scale post -->
  <line x1="100" y1="58" x2="100" y2="120" stroke="#E8A317" stroke-width="3" stroke-linecap="round"/>
  <!-- Scale beam -->
  <line x1="65" y1="78" x2="135" y2="78" stroke="#FFF8E7" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Left pan (tilted down - deposits heavier) -->
  <line x1="65" y1="78" x2="60" y2="95" stroke="#FFF8E7" stroke-width="1.5"/>
  <line x1="65" y1="78" x2="70" y2="95" stroke="#FFF8E7" stroke-width="1.5"/>
  <path d="M 52,95 Q 65,102 78,95" fill="none" stroke="#FFF8E7" stroke-width="1.5"/>
  <!-- Right pan -->
  <line x1="135" y1="78" x2="130" y2="88" stroke="#FFF8E7" stroke-width="1.5"/>
  <line x1="135" y1="78" x2="140" y2="88" stroke="#FFF8E7" stroke-width="1.5"/>
  <path d="M 122,88 Q 135,95 148,88" fill="none" stroke="#FFF8E7" stroke-width="1.5"/>
  <!-- Scale base -->
  <line x1="88" y1="120" x2="112" y2="120" stroke="#E8A317" stroke-width="2.5" stroke-linecap="round"/>

  <!-- Heart on top of post -->
  <path d="M100,55 C100,55 93,45 87,48 C81,51 81,59 100,68 C119,59 119,51 113,48 C107,45 100,55 100,55Z" fill="#CC5500"/>

  <!-- Stars -->
  <circle cx="52" cy="68" r="2" fill="#E8A317"/>
  <circle cx="148" cy="68" r="2" fill="#E8A317"/>
  <circle cx="100" cy="140" r="2" fill="#E8A317"/>
  <circle cx="68" cy="135" r="1.5" fill="#6B6B3C"/>
  <circle cx="132" cy="135" r="1.5" fill="#6B6B3C"/>

  <!-- "OFFICIAL" text -->
  <text x="100" y="155" text-anchor="middle" font-family="Arial, sans-serif" font-size="8" fill="#6B6B3C" letter-spacing="3" font-weight="700">OFFICIAL</text>
</svg>
